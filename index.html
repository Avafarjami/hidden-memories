<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hidden Memories</title>
  <meta name="description" content="Tap the floor and leave a message written on the ground in augmented reality.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Memories">
  <link rel="stylesheet" href="style.css">

  <!--
    Variant Launch gives Safari on iPhone/iPad real WebXR AR (true position
    tracking via an App Clip), which iOS otherwise has none of — see
    "Real AR tracking on iPhone" in README.md. OFF by default: the app
    works exactly as it does now, with the camera-only fallback on iOS,
    until this is turned on. To turn it on:
      1. Sign up free at https://launch.variant3d.com/ and create a project.
      2. In the Launch Admin dashboard, authorise the domain this app is
         served from — the whole domain (e.g. avafarjami.com), not just
         the /hidden-memories path.
      3. Copy the SDK key from the dashboard, paste it below in place of
         YOUR_SDK_KEY, and delete the two comment markers around the tag.
    This script must load before src/app.js checks for WebXR support, so
    it has to stay here, near the top of <head>, not moved lower.
  -->
  <!-- <script src="https://launchar.app/sdk/v1?key=YOUR_SDK_KEY&redirect=true"></script> -->
</head>
<body>

<video id="camera-feed" playsinline muted autoplay hidden></video>

<div id="overlay">
  <button id="exit-btn" type="button" aria-label="Exit" hidden>✕</button>
  <div id="status">Checking this device…</div>
  <form id="input-row" hidden autocomplete="off">
    <input id="msg-input" type="text" placeholder="write something…" enterkeyhint="send" autocapitalize="sentences" maxlength="200">
    <button id="send-btn" type="submit" aria-label="Send">↑</button>
  </form>
  <button id="start-btn" type="button">Start AR</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
