<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hidden Memories</title>
  <meta name="description" content="Tap the floor and leave a message written on the ground in augmented reality.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Memories">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<video id="camera-feed" playsinline muted autoplay hidden></video>

<div id="overlay">
  <button id="exit-btn" type="button" aria-label="Exit" hidden>✕</button>
  <div id="status">Checking this device…</div>
  <form id="input-row" hidden autocomplete="off">
    <input id="msg-input" type="text" placeholder="write something…" enterkeyhint="send" autocapitalize="sentences" maxlength="200">
    <button id="send-btn" type="submit" aria-label="Send">↑</button>
  </form>
  <button id="start-btn" type="button">Start AR</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
